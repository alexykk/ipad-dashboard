<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iOS Fullscreen Standalone App Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HKO Dashboard">
  
  <title>iPad Mini Dashboard - Hong Kong Observatory</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --warning-bg: #7f1d1d;
      --warning-border: #ef4444;
      --muted-color: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
      --green: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-align-items: center;
      align-items: center;
      min-height: 100%;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      width: 100%;
      max-width: 980px;
      height: 96vh;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    /* ===== Clock ===== */
    .clock-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      border: 1px solid var(--card-border);
      margin-bottom: 10px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .clock-time {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 1px;
      line-height: 1;
    }

    .clock-details {
      text-align: right;
    }

    .clock-date {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .clock-location {
      font-size: 0.8rem;
      color: var(--muted-color);
      margin-top: 2px;
    }

    /* ===== Cards ===== */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      margin-bottom: 10px;
    }

    .weather-section {
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .news-section {
      -webkit-flex: 1 1 auto;
      flex: 1 1 auto;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      min-height: 0;
      margin-bottom: 0;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      color: var(--text-color);
    }

    .section-title span {
      margin-right: 6px;
    }

    .update-meta {
      font-size: 0.7rem;
      color: var(--muted-color);
      font-weight: 400;
      margin-left: auto;
    }

    /* ===== Current Conditions ===== */
    .current-row {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 10px;
    }

    .current-icon {
      font-size: 3.2rem;
      line-height: 1;
      margin-right: 14px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .current-main {
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
    }

    .current-temp {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent-color);
      line-height: 1;
    }

    .current-temp span {
      font-size: 1.3rem;
      font-weight: 500;
      color: var(--muted-color);
    }

    .current-desc {
      font-size: 0.95rem;
      color: #e2e8f0;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-stats {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .stat-pill {
      font-size: 0.75rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 3px 8px;
      margin-right: 6px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }

    .stat-pill.humid {
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.12);
    }

    .stat-pill.rain {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.12);
    }

    /* ===== Local Forecast Text ===== */
    .local-forecast {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.4;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid var(--card-border);
    }

    .local-forecast strong {
      color: var(--accent-color);
      font-weight: 600;
    }

    /* ===== Warning Banner ===== */
    .warning-banner {
      display: none;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      -webkit-align-items: center;
      align-items: center;
    }

    .warning-banner.active {
      display: -webkit-flex;
      display: flex;
    }

    .warning-icon {
      font-size: 1.6rem;
      margin-right: 10px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .warning-content h3 {
      font-size: 0.8rem;
      color: #fca5a5;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .warning-content p {
      font-size: 0.78rem;
      color: #fef2f2;
      line-height: 1.3;
    }

    /* ===== 5-Day Forecast ===== */
    .forecast-grid {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }

    .day-card {
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 8px 3px;
      text-align: center;
      border: 1px solid var(--card-border);
      margin-right: 6px;
    }

    .day-card:last-child {
      margin-right: 0;
    }

    .day-name {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .day-date {
      font-size: 0.7rem;
      color: var(--muted-color);
      margin-bottom: 3px;
    }

    .weather-icon {
      font-size: 1.7rem;
      line-height: 1;
      margin: 3px 0;
    }

    .temp-range {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: center;
      justify-content: center;
      font-size: 0.8rem;
      margin-bottom: 3px;
    }

    .temp-max {
      font-weight: bold;
      color: var(--accent-color);
      margin-right: 4px;
    }

    .temp-min {
      color: var(--muted-color);
    }

    .humidity {
      font-size: 0.68rem;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
      display: inline-block;
    }

    /* ===== News ===== */
    .news-list {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;
      padding-right: 2px;
    }

    .news-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 9px 10px;
      text-decoration: none;
      color: inherit;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      margin-bottom: 7px;
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .news-item:active {
      background: rgba(255, 255, 255, 0.07);
    }

    .news-thumbnail {
      width: 72px;
      height: 50px;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.05);
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      margin-right: 10px;
      /* object-fit not reliable on iOS 9 → use background-image fallback via JS if needed */
    }

    .news-content {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
    }

    .news-item-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-color);
      line-height: 1.3;
      /* multi-line clamp simulation for old Safari */
      max-height: 2.6em;
      overflow: hidden;
    }

    .news-item-meta {
      font-size: 0.72rem;
      color: var(--muted-color);
      margin-top: 3px;
      text-align: right;
    }

    .loading, .error {
      text-align: center;
      padding: 16px;
      color: var(--muted-color);
      font-size: 0.88rem;
    }

    .error {
      color: #fca5a5;
    }

    /* subtle status bar */
    .status-bar {
      font-size: 0.65rem;
      color: var(--muted-color);
      text-align: center;
      padding: 4px 0 0;
      -webkit-flex-shrink: 0;
      flex-shrink
