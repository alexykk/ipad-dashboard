<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- iOS Fullscreen Standalone App Mode -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  
  <title>iPad Dashboard - Hong Kong Observatory</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --warning-bg: #7f1d1d;
      --warning-border: #ef4444;
      --muted-color: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: center;
      justify-content: center;
      -webkit-align-items: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden; /* Prevents bounce scrolling on iPad */
    }

    .container {
      width: 100%;
      max-width: 980px;
      height: 96vh;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      gap: 12px;
    }

    /* Live Clock Top Banner */
    .clock-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-align-items: center;
      align-items: center;
      border: 1px solid var(--card-border);
    }

    .clock-time {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 1px;
      line-height: 1;
    }

    .clock-details {
      text-align: right;
    }

    .clock-date {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .clock-location {
      font-size: 0.85rem;
      color: var(--muted-color);
    }

    /* Main Dashboard Section */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }

    .weather-section {
      -webkit-flex: 0 0 auto;
      flex: 0 0 auto;
    }

    .news-section {
      -webkit-flex: 1 1 auto;
      flex: 1 1 auto;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      min-height: 0; /* Allows inner scrolling container to shrink */
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 10px;
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      gap: 8px;
    }

    /* Weather Warning Banner */
    .warning-banner {
      display: none;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      -webkit-align-items: center;
      align-items: center;
      gap: 12px;
    }

    .warning-banner.active {
      display: -webkit-flex;
      display: flex;
    }

    .warning-icon {
      font-size: 1.8rem;
    }

    .warning-content h3 {
      font-size: 0.85rem;
      color: #fca5a5;
      text-transform: uppercase;
    }

    .warning-content p {
      font-size: 0.8rem;
      color: #fef2f2;
    }

    /* Weather 5-Day Row (Flexbox for stable rendering on iOS 9) */
    .forecast-grid {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      gap: 8px;
    }

    .day-card {
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px 4px;
      text-align: center;
      border: 1px solid var(--card-border);
    }

    .day-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .day-date {
      font-size: 0.75rem;
      color: var(--muted-color);
      margin-bottom: 4px;
    }

    .weather-icon {
      font-size: 1.8rem; 
      line-height: 1;
      margin: 4px 0;
    }

    .temp-range {
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .temp-max {
      font-weight: bold;
      color: var(--accent-color);
    }

    .temp-min {
      color: var(--muted-color);
    }

    .humidity {
      font-size: 0.7rem;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
      display: inline-block;
    }

    /* Scrollable News List */
    .news-list {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Kinetic scrolling for iOS */
      padding-right: 4px;
      -webkit-flex: 1;
      flex: 1;
    }

    .news-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      text-decoration: none;
      color: inherit;
      display: -webkit-flex;
      display: flex;
      gap: 12px;
      -webkit-align-items: center;
      align-items: center;
    }

    .news-thumbnail {
      width: 80px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.05);
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
    }

    .news-content {
      display: -webkit-flex;
      display: flex;
      -webkit-flex-direction: column;
      flex-direction: column;
      gap: 4px;
      -webkit-flex: 1;
      flex: 1;
      min-width: 0;
    }

    .news-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-color);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .news-item-meta {
      font-size: 0.75rem;
      color: var(--muted-color);
      display: -webkit-flex;
      display: flex;
      -webkit-justify-content: flex-end;
      justify-content: flex-end;
    }

    .loading, .error {
      text-align: center;
      padding: 20px;
      color: var(--muted-color);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Real-Time Clock Header -->
    <div class="clock-card">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-details">
        <div class="clock-date" id="clock-date">Loading date...</div>
        <div class="clock-location">📍 香港天文台 (HKO)</div>
      </div>
    </div>

    <!-- Weather Card -->
    <div class="dashboard-card weather-section">
      <div id="warning-banner" class="warning-banner">
        <div class="warning-icon">⚠️</div>
        <div class="warning-content">
          <h3>HKO Weather Warning</h3>
          <p id="warning-text">Severe weather conditions reported.</p>
        </div>
      </div>

      <div id="forecast" class="forecast-grid">
        <div class="loading">Loading Hong Kong Observatory Data...</div>
      </div>
    </div>

    <!-- Yahoo News Card -->
    <div class="dashboard-card news-section">
      <h2 class="section-title">📰 Yahoo! 香港新聞 (Top News)</h2>
      <div id="news-list" class="news-list">
        <div class="loading">Loading news feed...</div>
      </div>
    </div>

  </div>

  <script>
    var NEWS_RSS_URL = "https://hk.news.yahoo.com/rss/hong-kong";
    var NEWS_API_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(NEWS_RSS_URL);
    var DEFAULT_THUMBNAIL = "https://s.yimg.com/cv/apiv2/social/images/yahoo_default_logo.png";

    // 1. Digital Clock Function
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var seconds = now.getSeconds();

      var timeStr = (hours < 10 ? '0' : '') + hours + ':' + 
                    (minutes < 10 ? '0' : '') + minutes + ':' + 
                    (seconds < 10 ? '0' : '') + seconds;

      var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      var dateStr = days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();

      document.getElementById("clock-time").textContent = timeStr;
      document.getElementById("clock-date").textContent = dateStr;
    }

    // Maps HKO Weather Icon Codes to Emojis
    function getHkoEmoji(code, desc) {
      if (code === 50) return "☀️";
      if (code >= 51 && code <= 52) return "⛅";
      if (code >= 53 && code <= 54) return "🌦️";
      if (code >= 60 && code <= 61) return "☁️";
      if (code >= 62 && code <= 65) return "🌧️";
      if (code >= 70 && code <= 77) return "🌩️";
      if (code >= 80 && code <= 85) return "🌫️";
      if (code >= 90 && code <= 93) return "🌀";

      if (desc) {
        var lower = desc.toLowerCase();
        if (lower.indexOf("thunder") !== -1) return "🌩️";
        if (lower.indexOf("rain") !== -1 || lower.indexOf("shower") !== -1) return "🌧️";
        if (lower.indexOf("cloud") !== -1) return "☁️";
        if (lower.indexOf("fine") !== -1 || lower.indexOf("sunny") !== -1) return "☀️";
      }
      return "🌡️";
    }

    // 2. Fetch Forecast & Warnings
    function fetch5DayForecast() {
      var forecastEl = document.getElementById("forecast");
      var apiUrl = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=en";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", apiUrl, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);
            var forecastList = data.weatherForecast;

            if (!forecastList || forecastList.length === 0) {
              forecastEl.innerHTML = '<div class="error">No forecast data available.</div>';
              return;
            }

            // Memory-safe DOM replacement
            while (forecastEl.firstChild) {
              forecastEl.removeChild(forecastEl.firstChild);
            }

            var count = Math.min(5, forecastList.length);
            for (var i = 0; i < count; i++) {
              var item = forecastList[i];

              var dateStr = item.forecastDate;
              var month = dateStr.substring(4, 6);
              var day = dateStr.substring(6, 8);
              var monthDay = month + "/" + day;

              var weekDay = item.week;
              var shortDay = weekDay.substring(0, 3);
              var displayName = (i === 0) ? "Today" : shortDay;

              var maxTemp = item.forecastMaxtemp.value;
              var minTemp = item.forecastMintemp.value;
              var maxRh = item.forecastMaxrh.value;
              var minRh = item.forecastMinrh.value;
              var iconCode = item.ForecastIcon;
              var weatherDesc = item.forecastWeather || "";

              var iconEmoji = getHkoEmoji(iconCode, weatherDesc);

              var card = document.createElement("div");
              card.className = "day-card";
              card.innerHTML = 
                '<div class="day-name">' + displayName + '</div>' +
                '<div class="day-date">' + monthDay + '</div>' +
                '<div class="weather-icon" title="' + weatherDesc + '">' + iconEmoji + '</div>' +
                '<div class="temp-range">' +
                  '<span class="temp-max">' + maxTemp + '°C</span>' +
                  '<span class="temp-min">' + minTemp + '°C</span>' +
                '</div>' +
                '<div class="humidity">💧 ' + minRh + '-' + maxRh + '%</div>';

              forecastEl.appendChild(card);
            }
          } catch(e) {
            forecastEl.innerHTML = '<div class="error">Error processing HKO data.</div>';
          }
        } else {
          forecastEl.innerHTML = '<div class="error">Error loading HKO forecast.</div>';
        }
      };
      xhr.onerror = function() {
        forecastEl.innerHTML = '<div class="error">Network error connecting to HKO.</div>';
      };
      xhr.send();

      fetchHkoWarnings();
    }

    // Fetch Weather Warnings
    function fetchHkoWarnings() {
      var warningBanner = document.getElementById("warning-banner");
      var warningText = document.getElementById("warning-text");
      var warnUrl = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=en";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", warnUrl, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);
            var activeWarns = [];

            for (var key in data) {
              if (data.hasOwnProperty(key) && data[key]) {
                var warnObj = data[key];
                if (warnObj.name) {
                  activeWarns.push(warnObj.name);
                }
              }
            }

            if (activeWarns.length > 0) {
              warningText.textContent = activeWarns.join(" | ");
              warningBanner.className = "warning-banner active";
            } else {
              warningBanner.className = "warning-banner";
            }
          } catch(e) {}
        }
      };
      xhr.send();
    }

    // Extract image thumbnail safely
    function getThumbnailUrl(item) {
      if (item.thumbnail) return item.thumbnail;
      if (item.enclosure && item.enclosure.link) return item.enclosure.link;
      
      if (item.description) {
        var match = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match && match[1]) return match[1];
      }
      return DEFAULT_THUMBNAIL;
    }

    // 3. Fetch News Feed
    function fetchNewsFeed() {
      var newsListEl = document.getElementById("news-list");

      var xhr = new XMLHttpRequest();
      xhr.open("GET", NEWS_API_URL, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);

            if (!data.items || data.items.length === 0) {
              newsListEl.innerHTML = '<div class="error">No news headlines available.</div>';
              return;
            }

            // Memory-safe DOM replacement
            while (newsListEl.firstChild) {
              newsListEl.removeChild(newsListEl.firstChild);
            }

            var items = data.items.slice(0, 10);
            for (var i = 0; i < items.length; i++) {
              var item = items[i];
              var pubDate = new Date(item.pubDate);
              var hours = pubDate.getHours();
              var minutes = pubDate.getMinutes();
              var formattedTime = (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;
              var imgUrl = getThumbnailUrl(item);

              var newsCard = document.createElement("a");
              newsCard.className = "news-item";
              newsCard.href = item.link;
              newsCard.target = "_blank";
              newsCard.rel = "noopener noreferrer";

              newsCard.innerHTML = 
                '<img class="news-thumbnail" src="' + imgUrl + '" alt="Thumbnail" onerror="this.src=\'' + DEFAULT_THUMBNAIL + '\'">' +
                '<div class="news-content">' +
                  '<div class="news-item-title">' + item.title + '</div>' +
                  '<div class="news-item-meta">' +
                    '<span>' + formattedTime + '</span>' +
                  '</div>' +
                '</div>';

              newsListEl.appendChild(newsCard);
            }
          } catch(e) {
            newsListEl.innerHTML = '<div class="error">Error processing news data.</div>';
          }
        } else {
          newsListEl.innerHTML = '<div class="error">Unable to load news feed.</div>';
        }
      };
      xhr.onerror = function() {
        newsListEl.innerHTML = '<div class="error">Network error loading news.</div>';
      };
      xhr.send();
    }

    // Initial Execution
    updateClock();
    fetch5DayForecast();
    fetchNewsFeed();

    // Auto-Refresh Timers for Ambient Display
    setInterval(updateClock, 1000);                     // Clock: Every second
    setInterval(fetch5DayForecast, 15 * 60 * 1000);     // Weather: Every 15 minutes
    setInterval(fetchNewsFeed, 10 * 60 * 1000);        // News: Every 10 minutes
  </script>
</body>
</html>
