<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPad Dashboard - Hong Kong</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --warning-bg: #7f1d1d;
      --warning-border: #ef4444;
      --muted-color: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow: hidden; /* Prevents outer bounce scrolling on iPad */
    }

    .container {
      width: 100%;
      max-width: 980px;
      height: 96vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Live Clock Top Banner */
    .clock-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--card-border);
    }

    .clock-time {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 1px;
      line-height: 1;
    }

    .clock-details {
      text-align: right;
    }

    .clock-date {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .clock-location {
      font-size: 0.85rem;
      color: var(--muted-color);
    }

    /* Main Dashboard Section */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
    }

    .weather-section {
      flex: 0 0 auto;
    }

    .news-section {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0; /* Allows inner scrolling container to shrink */
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Weather Warning Banner */
    .warning-banner {
      display: none;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      align-items: center;
      gap: 12px;
    }

    .warning-banner.active {
      display: flex;
    }

    .warning-icon {
      font-size: 1.8rem;
    }

    .warning-content h3 {
      font-size: 0.85rem;
      color: #fca5a5;
      text-transform: uppercase;
    }

    .warning-content p {
      font-size: 0.8rem;
      color: #fef2f2;
    }

    /* Weather 5-Day Grid */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      border: 1px solid var(--card-border);
    }

    .day-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .day-date {
      font-size: 0.75rem;
      color: var(--muted-color);
      margin-bottom: 4px;
    }

    .weather-icon {
      font-size: 2rem; 
      line-height: 1;
      margin: 4px 0;
    }

    .temp-range {
      display: flex;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }

    .temp-max {
      font-weight: bold;
      color: var(--accent-color);
    }

    .temp-min {
      color: var(--muted-color);
    }

    .humidity {
      font-size: 0.7rem;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
      display: inline-block;
    }

    /* Scrollable News List */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Smooth kinetic scrolling for iOS 9 */
      padding-right: 4px;
      flex: 1;
    }

    .news-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .news-item-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-color);
      line-height: 1.3;
    }

    .news-item-meta {
      font-size: 0.75rem;
      color: var(--muted-color);
      display: flex;
      justify-content: space-between;
    }

    .news-source {
      color: var(--accent-color);
      font-weight: 500;
    }

    .loading, .error {
      text-align: center;
      padding: 20px;
      color: var(--muted-color);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Real-Time Clock Header -->
    <div class="clock-card">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-details">
        <div class="clock-date" id="clock-date">Loading date...</div>
        <div class="clock-location">📍 Hong Kong (香港)</div>
      </div>
    </div>

    <!-- Weather Card -->
    <div class="dashboard-card weather-section">
      <div id="warning-banner" class="warning-banner">
        <div class="warning-icon">⚠️</div>
        <div class="warning-content">
          <h3>Weather Advisory</h3>
          <p id="warning-text">Severe weather conditions expected.</p>
        </div>
      </div>

      <div id="forecast" class="forecast-grid">
        <div class="loading">Loading Hong Kong Weather...</div>
      </div>
    </div>

    <!-- Yahoo News Card -->
    <div class="dashboard-card news-section">
      <h2 class="section-title">📰 Yahoo! 香港新聞 (Top News)</h2>
      <div id="news-list" class="news-list">
        <div class="loading">Loading news feed...</div>
      </div>
    </div>

  </div>

  <script>
    // Hong Kong Coordinates
    var LATITUDE = 22.3193;
    var LONGITUDE = 114.1694;
    var LOCATION_LABEL = "Hong Kong";
    
    // Yahoo News HK Feed
    var NEWS_RSS_URL = "https://hk.news.yahoo.com/rss/hong-kong";
    var NEWS_API_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(NEWS_RSS_URL);

    // 1. Digital Clock Function (Updates every second)
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var seconds = now.getSeconds();

      var timeStr = (hours < 10 ? '0' : '') + hours + ':' + 
                    (minutes < 10 ? '0' : '') + minutes + ':' + 
                    (seconds < 10 ? '0' : '') + seconds;

      var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      var dateStr = days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();

      document.getElementById("clock-time").textContent = timeStr;
      document.getElementById("clock-date").textContent = dateStr;
    }

    function getWeatherDetails(code) {
      if (code === 0) return { icon: "☀️", desc: "Clear sky", warning: false };
      if (code >= 1 && code <= 3) return { icon: "⛅", desc: "Partly cloudy", warning: false };
      if (code >= 45 && code <= 48) return { icon: "🌫️", desc: "Foggy", warning: true, alertMsg: "Fog Advisory" };
      if (code >= 51 && code <= 67) return { icon: "🌧️", desc: "Rain / Drizzle", warning: false };
      if (code >= 71 && code <= 77) return { icon: "❄️", desc: "Snowfall", warning: true, alertMsg: "Snow Advisory" };
      if (code >= 80 && code <= 82) return { icon: "🌦️", desc: "Heavy Showers", warning: true, alertMsg: "Heavy Rain Warning" };
      if (code >= 95) return { icon: "🌩️", desc: "Thunderstorm", warning: true, alertMsg: "Thunderstorm Warning" };
      return { icon: "🌡️", desc: "Unknown", warning: false };
    }

    function formatDate(dateStr) {
      var date = new Date(dateStr.replace(/-/g, "/") + " 00:00:00");
      var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return {
        dayName: days[date.getDay()],
        monthDay: months[date.getMonth()] + " " + date.getDate()
      };
    }

    // 2. Fetch HK 5-Day Weather Forecast
    function fetch5DayForecast() {
      var forecastEl = document.getElementById("forecast");
      var warningBanner = document.getElementById("warning-banner");
      var warningText = document.getElementById("warning-text");

      var apiUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + LATITUDE + 
                     "&longitude=" + LONGITUDE + 
                     "&daily=weathercode,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max,relative_humidity_2m_min&timezone=Asia%2FHong_Kong&forecast_days=5";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", apiUrl, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);
            var daily = data.daily;

            forecastEl.innerHTML = "";
            var activeWarnings = [];

            for (var i = 0; i < daily.time.length; i++) {
              var formatted = formatDate(daily.time[i]);
              var dayName = formatted.dayName;
              var monthDay = formatted.monthDay;
              var weather = getWeatherDetails(daily.weathercode[i]);
              var maxTemp = Math.round(daily.temperature_2m_max[i]);
              var minTemp = Math.round(daily.temperature_2m_min[i]);
              var maxHum = daily.relative_humidity_2m_max[i];
              var minHum = daily.relative_humidity_2m_min[i];

              if (weather.warning && i <= 1) {
                activeWarnings.push((i === 0 ? "Today" : dayName) + ": " + weather.alertMsg);
              }

              var card = document.createElement("div");
              card.className = "day-card";
              card.innerHTML = 
                '<div class="day-name">' + (i === 0 ? "Today" : dayName) + '</div>' +
                '<div class="day-date">' + monthDay + '</div>' +
                '<div class="weather-icon" title="' + weather.desc + '">' + weather.icon + '</div>' +
                '<div class="temp-range">' +
                  '<span class="temp-max">' + maxTemp + '°C</span>' +
                  '<span class="temp-min">' + minTemp + '°C</span>' +
                '</div>' +
                '<div class="humidity">💧 ' + minHum + '-' + maxHum + '%</div>';
              
              forecastEl.appendChild(card);
            }

            if (activeWarnings.length > 0) {
              warningText.textContent = activeWarnings.join(" | ");
              warningBanner.className = "warning-banner active";
            } else {
              warningBanner.className = "warning-banner";
            }
          } catch(e) {
            forecastEl.innerHTML = '<div class="error">Error processing weather data.</div>';
          }
        } else {
          forecastEl.innerHTML = '<div class="error">Error loading weather data.</div>';
        }
      };
      xhr.onerror = function() {
        forecastEl.innerHTML = '<div class="error">Network error loading weather.</div>';
      };
      xhr.send();
    }

    // 3. Fetch Yahoo HK News Feed
    function fetchNewsFeed() {
      var newsListEl = document.getElementById("news-list");

      var xhr = new XMLHttpRequest();
      xhr.open("GET", NEWS_API_URL, true);
      xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 400) {
          try {
            var data = JSON.parse(xhr.responseText);

            if (!data.items || data.items.length === 0) {
              newsListEl.innerHTML = '<div class="error">No recent news headlines available.</div>';
              return;
            }

            newsListEl.innerHTML = "";

            var items = data.items.slice(0, 8);
            for (var i = 0; i < items.length; i++) {
              var item = items[i];
              var pubDate = new Date(item.pubDate);
              var hours = pubDate.getHours();
              var minutes = pubDate.getMinutes();
              var formattedTime = (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;

              var newsCard = document.createElement("a");
              newsCard.className = "news-item";
              newsCard.href = item.link;
              newsCard.target = "_blank";
              newsCard.rel = "noopener noreferrer";

              newsCard.innerHTML = 
                '<div class="news-item-title">' + item.title + '</div>' +
                '<div class="news-item-meta">' +
                  '<span class="news-source">Yahoo! 香港新聞</span>' +
                  '<span>' + formattedTime + '</span>' +
                '</div>';

              newsListEl.appendChild(newsCard);
            }
          } catch(e) {
            newsListEl.innerHTML = '<div class="error">Error processing news data.</div>';
          }
        } else {
          newsListEl.innerHTML = '<div class="error">Unable to load news feed.</div>';
        }
      };
      xhr.onerror = function() {
        newsListEl.innerHTML = '<div class="error">Network error loading news.</div>';
      };
      xhr.send();
    }

    // Initialize clock and data feeds
    updateClock();
    setInterval(updateClock, 1000);
    fetch5DayForecast();
    fetchNewsFeed();
  </script>
</body>
</html>
