<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Optimized for iPad Mini 1 Resolution (1024x768) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPad Dashboard</title>
  <style>
    /* Dark theme reduces display thermal load and screen aging */
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, HelveticaNeue, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }
    .grid {
      display: table;
      width: 100%;
      height: 100vh;
      table-layout: fixed;
    }
    .col {
      display: table-cell;
      vertical-align: top;
      padding: 10px;
    }
    .col-left { width: 45%; }
    .col-right { width: 55%; }
    
    .card {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    #clock {
      font-size: 64px;
      font-weight: bold;
      letter-spacing: -1px;
    }
    #date {
      font-size: 20px;
      color: #8e8e93;
      margin-top: 5px;
    }
    .temp {
      font-size: 52px;
      font-weight: 300;
      color: #0a84ff;
    }
    .news-item {
      border-bottom: 1px solid #2c2c2e;
      padding: 10px 0;
    }
    .news-title {
      font-size: 16px;
      color: #ffffff;
      text-decoration: none;
    }
    .news-time {
      font-size: 12px;
      color: #8e8e93;
      margin-top: 3px;
    }
  </style>
</head>
<body>

  <div class="grid">
    <!-- Left Column: Clock & Weather -->
    <div class="col col-left">
      <div class="card">
        <div id="clock">00:00</div>
        <div id="date">Loading date...</div>
      </div>
      
      <div class="card">
        <div style="font-size:18px; color:#8e8e93;">Current Weather</div>
        <div class="temp" id="weather-temp">--°C</div>
        <div id="weather-desc" style="font-size:18px;">Fetching weather...</div>
      </div>
    </div>

    <!-- Right Column: Local News RSS Feed -->
    <div class="col col-right">
      <div class="card">
        <div style="font-size:18px; color:#8e8e93; margin-bottom:10px;">Local Headlines</div>
        <div id="news-container">Loading RSS headlines...</div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Clock (Updates every second) ---
    function updateClock() {
      var now = new Date();
      var hours = String(now.getHours()).padStart(2, '0');
      var minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerHTML = hours + ':' + minutes;
      
      var options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('date').innerHTML = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- 2. Weather Fetcher (Open-Meteo, ES5 Compatible) ---
    function fetchWeather() {
      // Replace with your local Latitude and Longitude
      var lat = "35.6762";
      var lon = "139.6503";
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current_weather=true";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          document.getElementById('weather-temp').innerHTML = Math.round(data.current_weather.temperature) + "°C";
          document.getElementById('weather-desc').innerHTML = "Wind: " + data.current_weather.windspeed + " km/h";
        }
      };
      xhr.send();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000); // Refresh every 10 mins

    // --- 3. RSS News Fetcher (iOS 9 CORS Workaround via RSS2JSON) ---
    function fetchNews() {
      // Replace with your local news station's RSS feed URL
      var rssFeedUrl = encodeURIComponent("https://news.google.com/rss");
      var url = "https://api.rss2json.com/v1/api.json?rss_url=" + rssFeedUrl;

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          var output = "";
          var items = data.items.slice(0, 5); // Limit to top 5 news items
          for (var i = 0; i < items.length; i++) {
            output += '<div class="news-item">';
            output += '<div class="news-title">' + items[i].title + '</div>';
            output += '</div>';
          }
          document.getElementById('news-container').innerHTML = output;
        }
      };
      xhr.send();
    }
    fetchNews();
    setInterval(fetchNews, 1800000); // Refresh every 30 mins
  </script>
</body>
</html>
