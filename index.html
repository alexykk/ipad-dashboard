<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPad Dashboard - Yahoo HK News</title>
  <style>
    /* Reset & Base Layout */
    * { box-sizing: border-box; }
    body {
      background-color: #0d0e12;
      color: #ffffff;
      font-family: -apple-system, "PingFang HK", "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      overflow: hidden;
      height: 100vh;
    }

    /* Grid Layout */
    .dashboard {
      display: table;
      width: 100%;
      height: 100%;
      table-layout: fixed;
    }
    .col {
      display: table-cell;
      vertical-align: top;
      padding: 0 8px;
    }
    .col-left { width: 50%; }
    .col-right { width: 50%; }

    /* Card Containers */
    .card {
      background: #181a20;
      border: 1px solid #262933;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }

    /* Section Headers */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6e768e;
      margin-bottom: 12px;
    }

    /* Clock Styling */
    #clock {
      font-size: 72px;
      font-weight: 700;
      letter-spacing: -2px;
      color: #ffffff;
      line-height: 1;
    }
    #date {
      font-size: 18px;
      color: #8c95b0;
      margin-top: 8px;
      font-weight: 500;
    }

    /* Weather Styling */
    .temp-large {
      font-size: 56px;
      font-weight: 300;
      color: #4c9eff;
      line-height: 1;
    }
    .weather-meta {
      font-size: 14px;
      color: #8c95b0;
      margin-top: 10px;
    }

    /* 3-Day Forecast Strip */
    .forecast-row {
      display: table;
      width: 100%;
      margin-top: 16px;
      border-top: 1px solid #262933;
      padding-top: 12px;
    }
    .forecast-day {
      display: table-cell;
      text-align: center;
      width: 33.33%;
    }
    .forecast-name {
      font-size: 13px;
      color: #8c95b0;
      margin-bottom: 4px;
    }
    .forecast-temp {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    /* News Feed Layout */
    .news-item {
      border-bottom: 1px solid #262933;
      padding: 12px 0;
    }
    .news-item:last-child {
      border-bottom: none;
    }
    .news-title {
      font-size: 15px;
      line-height: 1.4;
      color: #e1e4ed;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- LEFT COLUMN: Clock & Weather -->
    <div class="col col-left">
      <!-- Clock Card -->
      <div class="card">
        <div id="clock">00:00</div>
        <div id="date">更新中...</div>
      </div>
      
      <!-- Current Weather & Forecast Card -->
      <div class="card">
        <div class="section-title">天氣預報</div>
        <div style="display: table; width: 100%;">
          <div style="display: table-cell; vertical-align: middle;">
            <div class="temp-large" id="current-temp">--°C</div>
          </div>
          <div style="display: table-cell; vertical-align: middle; text-align: right;">
            <div id="weather-condition" style="font-size: 18px; font-weight: 600;">載入中...</div>
            <div class="weather-meta" id="weather-details">風速: -- | 濕度: --</div>
          </div>
        </div>

        <!-- 3-Day Forecast Strip -->
        <div class="forecast-row" id="forecast-container">
          <div class="forecast-day"><div class="forecast-name">--</div><div class="forecast-temp">--°</div></div>
          <div class="forecast-day"><div class="forecast-name">--</div><div class="forecast-temp">--°</div></div>
          <div class="forecast-day"><div class="forecast-name">--</div><div class="forecast-temp">--°</div></div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Yahoo HK Local News -->
    <div class="col col-right">
      <div class="card" style="height: calc(100% - 16px);">
        <div class="section-title">Yahoo 新聞 (香港頭條)</div>
        <div id="news-container">載入雅虎新聞...</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Clock & Date (Traditional Chinese / HK Format)
    function updateClock() {
      var now = new Date();
      var hours = (now.getHours() < 10 ? '0' : '') + now.getHours();
      var minutes = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
      document.getElementById('clock').innerHTML = hours + ':' + minutes;
      
      var days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      var month = now.getMonth() + 1;
      var date = now.getDate();
      document.getElementById('date').innerHTML = month + "月" + date + "日 " + days[now.getDay()];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // WMO Weather Codes Translation to Chinese
    function getWeatherDesc(code) {
      if (code === 0) return "晴朗";
      if (code >= 1 && code <= 3) return "多雲 / 部分時間有陽光";
      if (code >= 45 && code <= 48) return "有霧";
      if (code >= 51 && code <= 67) return "有微雨";
      if (code >= 71 && code <= 77) return "有雪";
      if (code >= 80 && code <= 82) return "大雨";
      if (code >= 95) return "雷暴";
      return "多雲";
    }

    // 2. Open-Meteo Weather Fetcher (Default set to Hong Kong: 22.3193, 114.1694)
    function fetchWeather() {
      var lat = "22.3193";
      var lon = "114.1694";
      var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon + "&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FHong_Kong";

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          
          document.getElementById('current-temp').innerHTML = Math.round(data.current_weather.temperature) + "°C";
          document.getElementById('weather-condition').innerHTML = getWeatherDesc(data.current_weather.weathercode);
          document.getElementById('weather-details').innerHTML = "風速: " + Math.round(data.current_weather.windspeed) + " km/h";

          var forecastHTML = "";
          var days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
          for (var i = 1; i <= 3; i++) {
            var dateObj = new Date(data.daily.time[i]);
            var dayName = days[dateObj.getDay()];
            var maxTemp = Math.round(data.daily.temperature_2m_max[i]);
            var minTemp = Math.round(data.daily.temperature_2m_min[i]);
            
            forecastHTML += '<div class="forecast-day">';
            forecastHTML += '<div class="forecast-name">' + dayName + '</div>';
            forecastHTML += '<div class="forecast-temp">' + maxTemp + '° <span style="color:#6e768e; font-weight:normal;">' + minTemp + '°</span></div>';
            forecastHTML += '</div>';
          }
          document.getElementById('forecast-container').innerHTML = forecastHTML;
        }
      };
      xhr.send();
    }
    fetchWeather();
    setInterval(fetchWeather, 600000); // Update every 10 mins

    // 3. Yahoo News Hong Kong RSS Fetcher
    function fetchNews() {
      // Yahoo News HK RSS Feed URL
      var yahooHkRss = "https://hk.news.yahoo.com/rss/hong-kong";
      var url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(yahooHkRss);

      var xhr = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function() {
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          if (data.items && data.items.length > 0) {
            var output = "";
            var items = data.items.slice(0, 6); // Display top 6 news items
            for (var i = 0; i < items.length; i++) {
              output += '<div class="news-item">';
              output += '<div class="news-title">' + items[i].title + '</div>';
              output += '</div>';
            }
            document.getElementById('news-container').innerHTML = output;
          } else {
            document.getElementById('news-container').innerHTML = "無法載入新聞文章。";
          }
        }
      };
      xhr.onerror = function() {
        document.getElementById('news-container').innerHTML = "新聞連線失敗。";
      };
      xhr.send();
    }
    fetchNews();
    setInterval(fetchNews, 1800000); // Update every 30 mins
  </script>
</body>
</html>
