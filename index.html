<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Day Weather & News Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --warning-bg: #7f1d1d;
      --warning-border: #ef4444;
      --muted-color: #94a3b8;
      --card-border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 880px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Main Dashboard Box */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted-color);
      font-size: 0.95rem;
    }

    /* Weather Warning Banner */
    .warning-banner {
      display: none;
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      align-items: center;
      gap: 16px;
    }

    .warning-banner.active {
      display: flex;
    }

    .warning-icon {
      font-size: 3.5rem;
      line-height: 1;
    }

    .warning-content h3 {
      font-size: 1rem;
      color: #fca5a5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .warning-content p {
      font-size: 0.9rem;
      color: #fef2f2;
    }

    /* Forecast Grid */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      border: 1px solid var(--card-border);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .day-card:hover {
      transform: translateY(-4px);
      background: rgba(255, 255, 255, 0.07);
    }

    .day-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 2px;
    }

    .day-date {
      font-size: 0.8rem;
      color: var(--muted-color);
      margin-bottom: 12px;
    }

    .weather-icon {
      font-size: 3rem; 
      line-height: 1;
      margin: 8px 0 14px 0;
    }

    .temp-range {
      display: flex;
      justify-content: space-around;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .temp-max {
      font-weight: bold;
      color: var(--accent-color);
    }

    .temp-min {
      color: var(--muted-color);
    }

    .humidity {
      font-size: 0.8rem;
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 6px;
      border-radius: 6px;
      display: inline-block;
    }

    /* News Box Section */
    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .news-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    /* Scrollbar styling */
    .news-list::-webkit-scrollbar {
      width: 6px;
    }
    .news-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .news-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .news-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .news-item-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-color);
      line-height: 1.3;
    }

    .news-item-meta {
      font-size: 0.78rem;
      color: var(--muted-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .news-source {
      color: var(--accent-color);
      font-weight: 500;
    }

    .loading, .error {
      text-align: center;
      padding: 30px;
      color: var(--muted-color);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Weather Card -->
    <div class="dashboard-card">
      <header>
        <h1 id="location-name">Loading...</h1>
        <p class="subtitle">5-Day Weather Forecast</p>
      </header>

      <!-- Warning Banner -->
      <div id="warning-banner" class="warning-banner">
        <div class="warning-icon">⚠️</div>
        <div class="warning-content">
          <h3>Weather Warning</h3>
          <p id="warning-text">Severe weather conditions expected.</p>
        </div>
      </div>

      <!-- Forecast Grid -->
      <div id="forecast" class="forecast-grid">
        <div class="loading">Fetching forecast data...</div>
      </div>
    </div>

    <!-- News Box Card -->
    <div class="dashboard-card">
      <h2 class="section-title">📰 Top News Updates</h2>
      <div id="news-list" class="news-list">
        <div class="loading">Loading news feed...</div>
      </div>
    </div>

  </div>

  <script>
    // Configuration
    const LATITUDE = 35.6762;
    const LONGITUDE = 139.6503;
    const LOCATION_LABEL = "Tokyo";
    
    // RSS Feed Source for News Box (BBC News RSS converted via rss2json)
    const NEWS_RSS_URL = "https://feeds.bbci.co.uk/news/world/rss.xml";
    const NEWS_API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(NEWS_RSS_URL)}`;

    function getWeatherDetails(code) {
      if (code === 0) return { icon: "☀️", desc: "Clear sky", warning: false };
      if (code >= 1 && code <= 3) return { icon: "⛅", desc: "Partly cloudy", warning: false };
      if (code >= 45 && code <= 48) return { icon: "🌫️", desc: "Foggy", warning: true, alertMsg: "Fog Advisory: Low visibility" };
      if (code >= 51 && code <= 67) return { icon: "🌧️", desc: "Rain / Drizzle", warning: false };
      if (code >= 71 && code <= 77) return { icon: "❄️", desc: "Snowfall", warning: true, alertMsg: "Snow Advisory" };
      if (code >= 80 && code <= 82) return { icon: "🌦️", desc: "Heavy Showers", warning: true, alertMsg: "Heavy Rain Warning" };
      if (code >= 95) return { icon: "🌩️", desc: "Thunderstorm", warning: true, alertMsg: "Thunderstorm Warning" };
      return { icon: "🌡️", desc: "Unknown", warning: false };
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr + "T00:00:00");
      const dayName = date.toLocaleDateString("en-US", { weekday: "short" });
      const monthDay = date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      return { dayName, monthDay };
    }

    // 1. Fetch 5-Day Weather Forecast
    async function fetch5DayForecast() {
      const forecastEl = document.getElementById("forecast");
      const locationEl = document.getElementById("location-name");
      const warningBanner = document.getElementById("warning-banner");
      const warningText = document.getElementById("warning-text");

      locationEl.textContent = LOCATION_LABEL;

      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weathercode,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max,relative_humidity_2m_min&timezone=auto&forecast_days=5`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Weather fetch failed");
        
        const data = await response.json();
        const daily = data.daily;

        forecastEl.innerHTML = "";
        let activeWarnings = [];

        for (let i = 0; i < daily.time.length; i++) {
          const { dayName, monthDay } = formatDate(daily.time[i]);
          const weather = getWeatherDetails(daily.weathercode[i]);
          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);
          const maxHum = daily.relative_humidity_2m_max[i];
          const minHum = daily.relative_humidity_2m_min[i];

          if (weather.warning && i <= 1) {
            activeWarnings.push(`${i === 0 ? 'Today' : dayName}: ${weather.alertMsg}`);
          }

          const card = document.createElement("div");
          card.className = "day-card";
          card.innerHTML = `
            <div class="day-name">${i === 0 ? "Today" : dayName}</div>
            <div class="day-date">${monthDay}</div>
            <div class="weather-icon" title="${weather.desc}">${weather.icon}</div>
            <div class="temp-range">
              <span class="temp-max">${maxTemp}°C</span>
              <span class="temp-min">${minTemp}°C</span>
            </div>
            <div class="humidity">💧 ${minHum}-${maxHum}%</div>
          `;
          forecastEl.appendChild(card);
        }

        if (activeWarnings.length > 0) {
          warningText.textContent = activeWarnings.join(" | ");
          warningBanner.classList.add("active");
        } else {
          warningBanner.classList.remove("active");
        }

      } catch (err) {
        forecastEl.innerHTML = `<div class="error">Error loading weather data.</div>`;
        console.error(err);
      }
    }

    // 2. Fetch News Feed for the News Box
    async function fetchNewsFeed() {
      const newsListEl = document.getElementById("news-list");

      try {
        const response = await fetch(NEWS_API_URL);
        if (!response.ok) throw new Error("News fetch failed");

        const data = await response.json();

        if (!data.items || data.items.length === 0) {
          newsListEl.innerHTML = `<div class="error">No recent news headlines available.</div>`;
          return;
        }

        newsListEl.innerHTML = "";

        // Display up to 6 top news items
        data.items.slice(0, 6).forEach(item => {
          const pubDate = new Date(item.pubDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          const newsCard = document.createElement("a");
          newsCard.className = "news-item";
          newsCard.href = item.link;
          newsCard.target = "_blank";
          newsCard.rel = "noopener noreferrer";

          newsCard.innerHTML = `
            <div class="news-item-title">${item.title}</div>
            <div class="news-item-meta">
              <span class="news-source">BBC World News</span>
              <span>${pubDate}</span>
            </div>
          `;
          newsListEl.appendChild(newsCard);
        });

      } catch (err) {
        newsListEl.innerHTML = `<div class="error">Unable to load news feed.</div>`;
        console.error(err);
      }
    }

    // Run Both Loaders
    fetch5DayForecast();
    fetchNewsFeed();
  </script>
</body>
</html>
