<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Day Weather Forecast</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --muted-color: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted-color);
      font-size: 0.95rem;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 16px;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease;
    }

    .day-card:hover {
      transform: translateY(-4px);
    }

    .day-name {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .day-date {
      font-size: 0.8rem;
      color: var(--muted-color);
      margin-bottom: 12px;
    }

    .weather-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .temp-range {
      display: flex;
      justify-content: space-around;
      font-size: 0.95rem;
    }

    .temp-max {
      font-weight: bold;
      color: var(--accent-color);
    }

    .temp-min {
      color: var(--muted-color);
    }

    .loading, .error {
      text-align: center;
      padding: 40px;
      color: var(--muted-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="location-name">Loading location...</h1>
      <p class="subtitle">5-Day Weather Forecast</p>
    </header>

    <div id="forecast" class="forecast-grid">
      <div class="loading">Fetching forecast data...</div>
    </div>
  </div>

  <script>
    // Configuration: Set location coordinates (Default: Tokyo / Change to your target location)
    const LATITUDE = 35.6762;
    const LONGITUDE = 139.6503;
    const LOCATION_LABEL = "Tokyo";

    // Open-Meteo WMO Weather Code to Icon mapping
    function getWeatherDetails(code) {
      if (code === 0) return { icon: "☀️", desc: "Clear sky" };
      if (code >= 1 && code <= 3) return { icon: "⛅", desc: "Partly cloudy" };
      if (code >= 45 && code <= 48) return { icon: "🌫️", desc: "Foggy" };
      if (code >= 51 && code <= 67) return { icon: "🌧️", desc: "Rain / Drizzle" };
      if (code >= 71 && code <= 77) return { icon: "❄️", desc: "Snow" };
      if (code >= 80 && code <= 82) return { icon: "🌦️", desc: "Showers" };
      if (code >= 95) return { icon: "🌩️", desc: "Thunderstorm" };
      return { icon: "🌡️", desc: "Unknown" };
    }

    // Helper to format date strings (YYYY-MM-DD) into Day name and short date
    function formatDate(dateStr) {
      const date = new Date(dateStr + "T00:00:00");
      const dayName = date.toLocaleDateString("en-US", { weekday: "short" });
      const monthDay = date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
      return { dayName, monthDay };
    }

    async function fetch5DayForecast() {
      const forecastEl = document.getElementById("forecast");
      const locationEl = document.getElementById("location-name");
      
      locationEl.textContent = LOCATION_LABEL;

      // API Request requesting 5 forecast days and daily parameters
      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Failed to fetch weather data");
        
        const data = await response.json();
        const daily = data.daily;

        // Clear existing loading indicator
        forecastEl.innerHTML = "";

        // Loop through the 5 days returned
        for (let i = 0; i < daily.time.length; i++) {
          const { dayName, monthDay } = formatDate(daily.time[i]);
          const weather = getWeatherDetails(daily.weathercode[i]);
          const maxTemp = Math.round(daily.temperature_2m_max[i]);
          const minTemp = Math.round(daily.temperature_2m_min[i]);

          const card = document.createElement("div");
          card.className = "day-card";
          card.innerHTML = `
            <div class="day-name">${i === 0 ? "Today" : dayName}</div>
            <div class="day-date">${monthDay}</div>
            <div class="weather-icon" title="${weather.desc}">${weather.icon}</div>
            <div class="temp-range">
              <span class="temp-max">${maxTemp}°C</span>
              <span class="temp-min">${minTemp}°C</span>
            </div>
          `;
          forecastEl.appendChild(card);
        }
      } catch (err) {
        forecastEl.innerHTML = `<div class="error">Error loading forecast. Please try again.</div>`;
        console.error(err);
      }
    }

    // Initialize forecast load
    fetch5DayForecast();
  </script>
</body>
</html>
